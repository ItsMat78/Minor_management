---
ansible_user: minor                         # SSH user on the target server
ansible_python_interpreter: /usr/bin/python3

project_title: minor_project_management

deployment_group: iiitnr

# The app is deployed as a git clone and served straight out of it: nginx serves the built SPA
# from client/dist, and pm2 (app name "minor-portal") runs server/dist/index.js from server/.
repo_root: "/home/{{ ansible_user }}/Minor_management"
client_dist: "{{ repo_root }}/client/dist"

nginx_server_name: minor-project.iiitnr.ac.in
nginx_config_path: /etc/nginx/sites-available
nginx_enabled_path: /etc/nginx/sites-enabled
api_backend_port: 5000  # internal port Node.js listens on; nginx proxies /api to it from 443
acme_webroot: /var/www/html

# Certificates are managed outside ansible: a wildcard *.iiitnr.ac.in issued to the institute,
# placed here by hand. The ssl_certificates role would overwrite them from ansible/ssl/, so it
# is gated behind this flag in site.yml. Leave it false unless replacing the certificate.
manage_ssl_certificates: false
ssl_cert_dir: /etc/ssl/minor-project
ssl_cert_file: "{{ ssl_cert_dir }}/college.cer"
ssl_key_file: "{{ ssl_cert_dir }}/college.key"

local_ssl_cert_path: ./ssl/certificate.crt
local_ssl_key_path: ./ssl/key.key

nodejs_version: "20"

pm2_startup_user: "{{ ansible_user }}"

github_runner_version: "2.315.0"
github_runner_install_dir: "/home/{{ ansible_user }}/actions-runner"
github_runner_name: "{{ project_title }}-runner"
github_runner_labels: "{{ project_title }},self-hosted,Linux"
github_runner_repo_url: "https://github.com/PraveenBajpai123/Minor_management"

startup_script_path: /usr/local/bin/project-startup.sh
startup_service_name: "{{ project_title }}-startup"

# Bastion / jump host (SSH args are in ansible.cfg [ssh_connection] ssh_args)
bastion_host: "1.6.33.107"
bastion_user: admission
bastion_port: 22
